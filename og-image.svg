<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;family=Inter:wght@400;500&amp;display=swap');
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#F7F5F0"/>

  <!-- Accent bar left -->
  <rect x="0" y="0" width="6" height="630" fill="#E86C26"/>

  <!-- Logo -->
  <text x="80" y="120" font-family="Space Grotesk, sans-serif" font-weight="700" font-size="36" fill="#1A1A1A">orcanaut.</text>

  <!-- Eyebrow -->
  <text x="80" y="172" font-family="Inter, sans-serif" font-weight="500" font-size="20" fill="#E86C26" letter-spacing="1.5">AI DECISION INTELLIGENCE</text>

  <!-- Headline -->
  <text x="80" y="280" font-family="Space Grotesk, sans-serif" font-weight="700" font-size="62" fill="#1A1A1A">Prove What Your AI</text>
  <text x="80" y="358" font-family="Space Grotesk, sans-serif" font-weight="700" font-size="62" fill="#1A1A1A">Decided <tspan fill="#E86C26">&#8212; and Why</tspan></text>

  <!-- Description -->
  <text x="80" y="436" font-family="Inter, sans-serif" font-weight="400" font-size="26" fill="#1A1A1A" opacity="0.55">Capture, explain &amp; prove every AI decision.</text>
  <text x="80" y="474" font-family="Inter, sans-serif" font-weight="400" font-size="26" fill="#1A1A1A" opacity="0.55">Immutable logging, plain-language explanations &#8212; built for the EU AI Act.</text>

  <!-- Pipeline pills -->
  <!-- capture -->
  <rect x="80" y="528" rx="14" ry="14" width="98" height="28" fill="none" stroke="#1A1A1A" stroke-opacity="0.12" stroke-width="1.5"/>
  <text x="129" y="547" font-family="Inter, sans-serif" font-weight="500" font-size="13" fill="#1A1A1A" fill-opacity="0.5" text-anchor="middle">CAPTURE</text>
  <!-- arrow -->
  <text x="191" y="547" font-family="Inter, sans-serif" font-size="14" fill="#1A1A1A" fill-opacity="0.2">&#8250;</text>
  <!-- log -->
  <rect x="206" y="528" rx="14" ry="14" width="60" height="28" fill="none" stroke="#1A1A1A" stroke-opacity="0.12" stroke-width="1.5"/>
  <text x="236" y="547" font-family="Inter, sans-serif" font-weight="500" font-size="13" fill="#1A1A1A" fill-opacity="0.5" text-anchor="middle">LOG</text>
  <!-- arrow -->
  <text x="279" y="547" font-family="Inter, sans-serif" font-size="14" fill="#1A1A1A" fill-opacity="0.2">&#8250;</text>
  <!-- explain -->
  <rect x="294" y="528" rx="14" ry="14" width="92" height="28" fill="none" stroke="#1A1A1A" stroke-opacity="0.12" stroke-width="1.5"/>
  <text x="340" y="547" font-family="Inter, sans-serif" font-weight="500" font-size="13" fill="#1A1A1A" fill-opacity="0.5" text-anchor="middle">EXPLAIN</text>
  <!-- arrow -->
  <text x="399" y="547" font-family="Inter, sans-serif" font-size="14" fill="#1A1A1A" fill-opacity="0.2">&#8250;</text>
  <!-- monitor -->
  <rect x="414" y="528" rx="14" ry="14" width="98" height="28" fill="none" stroke="#1A1A1A" stroke-opacity="0.12" stroke-width="1.5"/>
  <text x="463" y="547" font-family="Inter, sans-serif" font-weight="500" font-size="13" fill="#1A1A1A" fill-opacity="0.5" text-anchor="middle">MONITOR</text>
  <!-- arrow -->
  <text x="525" y="547" font-family="Inter, sans-serif" font-size="14" fill="#1A1A1A" fill-opacity="0.2">&#8250;</text>
  <!-- prove -->
  <rect x="540" y="528" rx="14" ry="14" width="78" height="28" fill="#E86C26" fill-opacity="0.1" stroke="#E86C26" stroke-opacity="0.25" stroke-width="1.5"/>
  <text x="579" y="547" font-family="Inter, sans-serif" font-weight="500" font-size="13" fill="#E86C26" text-anchor="middle">PROVE</text>

  <!-- URL -->
  <text x="1120" y="590" font-family="Inter, sans-serif" font-weight="500" font-size="18" fill="#1A1A1A" fill-opacity="0.3" text-anchor="end">orcanaut.com</text>
</svg>
